<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - Skripsi IoT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: "Inter", system-ui, sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <!-- Login Section -->
    <div
      id="loginSection"
      class="min-h-screen flex items-center justify-center px-4"
    >
      <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">
        <div class="text-center mb-6">
          <div
            class="inline-flex items-center justify-center w-14 h-14 bg-blue-100 rounded-full mb-3"
          >
            <svg
              class="w-7 h-7 text-blue-600"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 11c1.657 0 3-1.343 3-3S13.657 5 12 5 9 6.343 9 8s1.343 3 3 3zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
              />
            </svg>
          </div>
          <h2 class="text-2xl font-bold text-gray-800">Login Admin</h2>
          <p class="text-gray-500 text-sm mt-1">Masuk ke dashboard IoT</p>
        </div>
        <div class="space-y-4">
          <input
            type="email"
            id="email"
            placeholder="Email Admin"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
          />
          <input
            type="password"
            id="password"
            placeholder="Password"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
          />
          <button
            id="loginBtn"
            class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition"
          >
            Login
          </button>
        </div>
      </div>
    </div>

    <!-- Admin Section -->
    <div id="adminSection" style="display: none">
      <!-- Navbar -->
      <nav class="bg-white border-b border-gray-200 sticky top-0 z-10">
        <div
          class="max-w-5xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between"
        >
          <div class="flex items-center gap-3">
            <div
              class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center"
            >
              <svg
                class="w-5 h-5 text-white"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2z"
                />
              </svg>
            </div>
            <h1 class="text-xl font-bold text-gray-800">Dashboard IoT</h1>
          </div>
          <button
            id="logoutBtn"
            class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white text-sm font-medium rounded-lg transition"
          >
            Logout
          </button>
        </div>
      </nav>

      <main class="max-w-5xl mx-auto px-4 sm:px-6 py-6 space-y-6">
        <!-- Tambah Perangkat -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
          <h2 class="text-lg font-semibold text-gray-800 mb-4">
            Tambah Perangkat ESP32
          </h2>
          <div class="flex flex-col sm:flex-row gap-3">
            <input
              type="text"
              id="deviceId"
              placeholder="Masukkan ID Perangkat (cth: KTANI-A1B2...)"
              class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
            />
            <button
              id="addBtn"
              class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition whitespace-nowrap"
            >
              Tambah ke Firestore
            </button>
          </div>
        </div>

        <!-- Monitoring -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
          <h2 class="text-lg font-semibold text-gray-800 mb-4">
            Monitoring Status Perangkat
          </h2>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="border-b border-gray-200">
                  <th
                    class="text-left py-3 px-4 font-semibold text-gray-600 uppercase text-xs tracking-wider"
                  >
                    Device ID
                  </th>
                  <th
                    class="text-left py-3 px-4 font-semibold text-gray-600 uppercase text-xs tracking-wider"
                  >
                    Status
                  </th>
                  <th
                    class="text-left py-3 px-4 font-semibold text-gray-600 uppercase text-xs tracking-wider"
                  >
                    Last Seen
                  </th>
                  <th
                    class="text-left py-3 px-4 font-semibold text-gray-600 uppercase text-xs tracking-wider"
                  >
                    Diklaim Oleh
                  </th>
                  <th
                    class="text-left py-3 px-4 font-semibold text-gray-600 uppercase text-xs tracking-wider"
                  >
                    Aksi
                  </th>
                </tr>
              </thead>

              <tbody id="tableBody" class="divide-y divide-gray-100">
                <tr>
                  <td colspan="3" class="text-center py-8 text-gray-400">
                    Memuat data...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
